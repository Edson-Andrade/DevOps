services:
  redis-db:
    image: redis:7-alpine
    container_name: lab-redis
    volumes:
      - redis_data:/data
    networks:
      - rede-interna

  api-web:
    build: ./app
    container_name: lab-api
    depends_on:
      - redis-db
    networks:
      - rede-interna

  proxy-nginx:
    image: nginx:alpine
    container_name: lab-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-web
    networks:
      - rede-interna

volumes:
  redis_data:

networks:
  rede-interna:
    driver: bridge
